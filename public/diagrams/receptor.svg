<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img"><title>Which Receptor checks could work off Redbelly</title><rect width="720" height="290" rx="8" fill="#141f26" stroke="#263641"/><text x="24" y="38" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="17" font-weight="600" fill="#f1f5f8">Which Receptor checks could work off Redbelly</text><text x="24" y="78" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#8fa1ad">On Redbelly today (Confirmed)</text><text x="380" y="78" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#8fa1ad">On another chain (Analysis)</text><rect x="24" y="90" width="320" height="44" rx="4" fill="#0c1317" stroke="#263641"/><text x="184.0" y="108.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Proof by Query: on chain,</text><text x="184.0" y="125.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">verifier contract on Redbelly</text><path d="M344 112L372 112" stroke="#8fa1ad"/><rect x="372" y="90" width="324" height="44" rx="4" fill="#0c1317" stroke="#263641"/><text x="534.0" y="108.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">No public source shows it</text><text x="534.0" y="125.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">verified on another chain</text><rect x="24" y="144" width="320" height="44" rx="4" fill="#0c1317" stroke="#263641"/><text x="184.0" y="162.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Selective disclosure:</text><text x="184.0" y="179.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">off chain only</text><path d="M344 166L372 166" stroke="#8fa1ad"/><rect x="372" y="144" width="324" height="44" rx="4" fill="#0c1317" stroke="#263641"/><text x="534.0" y="162.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Cannot be checked by a contract</text><text x="534.0" y="179.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">on another chain by itself</text><rect x="24" y="198" width="320" height="44" rx="4" fill="#0c1317" stroke="#263641"/><text x="184.0" y="216.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Issuer trust is set</text><text x="184.0" y="233.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">per contract</text><path d="M344 220L372 220" stroke="#8fa1ad"/><rect x="372" y="198" width="324" height="44" rx="4" fill="#0c1317" stroke="#263641"/><text x="534.0" y="216.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">A contract elsewhere needs</text><text x="534.0" y="233.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">its own choice of issuers</text><text x="24" y="272" font-family="JetBrains Mono,ui-monospace,monospace" font-size="12" fill="#8fa1ad">Last verified 21 Oct 2026. Sources S7, S28, S31.</text></svg>