<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"><title>Where compliance could break (Analysis)</title><rect width="720" height="300" rx="8" fill="#141f26" stroke="#263641"/><text x="24" y="38" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="17" font-weight="600" fill="#f1f5f8">Where compliance could break (Analysis)</text><rect x="24" y="60" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="130.0" y="88.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Rules left behind</text><text x="130.0" y="105.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">A copy may move freely</text><rect x="254" y="60" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="360.0" y="88.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Stale permission</text><text x="360.0" y="105.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Entry can outlive credential</text><rect x="484" y="60" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="590.0" y="88.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Two rule sets</text><text x="590.0" y="105.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Firewall and credential differ</text><rect x="24" y="152" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="130.0" y="180.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Silent no-op</text><text x="130.0" y="197.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Unlisted sender: no effect</text><rect x="254" y="152" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="360.0" y="180.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Token approval</text><text x="360.0" y="197.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Quant's signers must approve</text><rect x="484" y="152" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="590.0" y="180.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Relayer trust</text><text x="590.0" y="197.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Relayers decide what mints</text><text x="24" y="248" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#8fa1ad">Each box is a risk described in chapter 8, not a finding that it happens.</text><text x="24" y="282" font-family="JetBrains Mono,ui-monospace,monospace" font-size="12" fill="#8fa1ad">Last verified 21 Oct 2026. Sources S5, S7, S11, S14, S16, S17, S24.</text></svg>