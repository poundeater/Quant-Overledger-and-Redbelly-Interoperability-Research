<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img"><title>Where Redbelly compliance checks stop</title><rect width="720" height="240" rx="8" fill="#141f26" stroke="#263641"/><text x="24" y="38" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="17" font-weight="600" fill="#f1f5f8">Where Redbelly compliance checks stop</text><rect x="24" y="64" width="300" height="130" rx="8" fill="#0c1317" stroke="#263641"/><text x="40" y="92" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="15" font-weight="700" fill="#ffb3ae">On Redbelly</text><text x="40" y="120" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="14" fill="#c2ced6">Receptor credential checked</text><text x="40" y="144" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="14" fill="#c2ced6">Proof by Query, revocation first</text><text x="40" y="168" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="14" fill="#c2ced6">Tokeniser rules on every transfer</text><rect x="396" y="64" width="300" height="130" rx="8" fill="#0c1317" stroke="#263641"/><text x="412" y="92" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="15" font-weight="700" fill="#ffb3ae">On another chain</text><text x="412" y="120" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="14" fill="#c2ced6">Copy of the asset</text><text x="412" y="144" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="14" fill="#c2ced6">No public source shows the checks</text><text x="412" y="168" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="14" fill="#c2ced6">travelling with it.</text><text x="412" y="186" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="14" fill="#c2ced6">Rules need a rebuild.</text><path d="M324 130H396" stroke="#8fa1ad"/><path d="M360 64V194" stroke="#EF5350" stroke-dasharray="5 4"/><text x="24" y="222" font-family="JetBrains Mono,ui-monospace,monospace" font-size="12" fill="#8fa1ad">Last verified 19-20 Oct 2026</text></svg>