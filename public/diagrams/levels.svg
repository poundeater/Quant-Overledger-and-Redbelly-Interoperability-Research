<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img"><title>Three meanings of connect, three answers</title><rect width="720" height="270" rx="8" fill="#141f26" stroke="#263641"/><text x="24" y="38" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="17" font-weight="600" fill="#f1f5f8">Three meanings of connect, three answers</text><rect x="24" y="60" width="212" height="76" rx="4" fill="#0c1317" stroke="#263641"/><text x="130.0" y="94.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Read and send</text><text x="130.0" y="111.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">through the Gateway</text><rect x="254" y="60" width="212" height="76" rx="4" fill="#0c1317" stroke="#263641"/><text x="360.0" y="94.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Move value and messages</text><text x="360.0" y="111.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">through Fusion</text><rect x="484" y="60" width="212" height="76" rx="4" fill="#0c1317" stroke="#263641"/><text x="590.0" y="94.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">A bridge outside</text><text x="590.0" y="111.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Overledger</text><circle cx="32" cy="168" r="5" fill="#EF5350"/><text x="44" y="172" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" fill="#c2ced6">Refused, Tested</text><text x="44" y="194" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" fill="#8fa1ad">Not in live list, T2 T3 T5</text><circle cx="262" cy="168" r="5" fill="#8fa1ad"/><text x="274" y="172" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" fill="#c2ced6">Not listed, Analysis</text><text x="274" y="194" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" fill="#8fa1ad">No Redbelly in the list, T2</text><circle cx="492" cy="168" r="5" fill="#86EFAC"/><text x="504" y="172" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" fill="#c2ced6">Live, Confirmed</text><text x="504" y="194" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" fill="#8fa1ad">Not an Overledger route</text><text x="24" y="232" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#8fa1ad">Only the third answer is live today, and it does not run through Quant.</text><text x="24" y="252" font-family="JetBrains Mono,ui-monospace,monospace" font-size="12" fill="#8fa1ad">Last verified 21 Oct 2026. Sources S4, S5, S11, S29, S30, S34, T2, T3, T5.</text></svg>