<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"><title>The work, step by step (Analysis)</title><rect width="720" height="300" rx="8" fill="#141f26" stroke="#263641"/><text x="24" y="38" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="17" font-weight="600" fill="#f1f5f8">The work, step by step (Analysis)</text><rect x="24" y="60" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="130.0" y="88.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">1. Confirm the basics</text><text x="130.0" y="105.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Access rules, network name</text><rect x="254" y="60" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="360.0" y="88.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">2. Decide what connect</text><text x="360.0" y="105.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">means: Gateway or Fusion</text><rect x="484" y="60" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="590.0" y="88.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">3. Gateway work</text><text x="590.0" y="105.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Register a node, health check</text><rect x="24" y="152" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="130.0" y="180.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">4. Fusion work</text><text x="130.0" y="197.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Bridge and dispute contracts</text><rect x="254" y="152" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="360.0" y="180.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">5. Compliance design</text><text x="360.0" y="197.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Which assets, who checks</text><rect x="484" y="152" width="212" height="64" rx="4" fill="#0c1317" stroke="#263641"/><text x="590.0" y="180.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">6. Test</text><text x="590.0" y="197.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Redbelly 153, Fusion 73073</text><text x="24" y="248" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#8fa1ad">Time and cost are Unknown. Quant's figure of about 2 days is for a new chain family.</text><text x="24" y="282" font-family="JetBrains Mono,ui-monospace,monospace" font-size="12" fill="#8fa1ad">Last verified 21 Oct 2026. Sources S4, S5, S12.</text></svg>