<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img"><title>How write access works on Redbelly</title><rect width="720" height="210" rx="8" fill="#141f26" stroke="#263641"/><text x="24" y="38" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="17" font-weight="600" fill="#f1f5f8">How write access works on Redbelly</text><rect x="24" y="70" width="148" height="52" rx="4" fill="#0c1317" stroke="#263641"/><text x="98.0" y="92.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Accredited</text><text x="98.0" y="109.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">issuer</text><rect x="198" y="70" width="148" height="52" rx="4" fill="#0c1317" stroke="#263641"/><text x="272.0" y="92.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">User claims</text><text x="272.0" y="109.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">access credential</text><path d="M174 96H196" stroke="#8fa1ad"/><rect x="372" y="70" width="148" height="52" rx="4" fill="#0c1317" stroke="#263641"/><text x="446.0" y="92.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Account enabled</text><text x="446.0" y="109.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">by a contract</text><path d="M348 96H370" stroke="#8fa1ad"/><rect x="546" y="70" width="148" height="52" rx="4" fill="#0c1317" stroke="#263641"/><text x="620.0" y="92.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">Can write to</text><text x="620.0" y="109.5" text-anchor="middle" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#f1f5f8">the network</text><path d="M522 96H544" stroke="#8fa1ad"/><text x="24" y="156" font-family="Be Vietnam Pro,system-ui,sans-serif" font-size="13" fill="#c2ced6">Whether read-only RPC access needs a credential is Unknown.</text><text x="24" y="192" font-family="JetBrains Mono,ui-monospace,monospace" font-size="12" fill="#8fa1ad">Last verified 20 Oct 2026. Sources S6, S14.</text></svg>